version: '3.9'

# Local full-stack: docker compose up --build
# Migrations run automatically on backend start (docker-entrypoint.sh).
# For production deploys, use a real secrets manager — never these defaults.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_local_only
      POSTGRES_DB: logistics_superapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d logistics_superapp']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://app_user:dev_local_only@db:5432/logistics_superapp
      JWT_ACCESS_SECRET: local_dev_jwt_access_secret_min_32_characters
      JWT_REFRESH_SECRET: local_dev_jwt_refresh_secret_min_32_characters
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 30d
      OTP_EXPIRY_SECONDS: 300
      OTP_MAX_ATTEMPTS: 5
      OTP_RESEND_COOLDOWN_SECONDS: 30
      QUOTE_TTL_SECONDS: 90
      ALLOW_TEST_OTP: 'true'
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
