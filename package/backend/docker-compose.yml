version: '3.9'

# Brings up the backend and a real database together with one command:
#   docker compose up --build
#
# This is for LOCAL testing and as a starting point for real cloud
# hosting — it is NOT itself a hosting solution. Nothing here runs
# permanently on the internet; it runs on whatever machine executes this
# file, for as long as that machine keeps it running. Real hosting means
# taking this same Dockerfile and running it on an always-on cloud
# platform (see backend/HOSTING.md for what that actually involves).
#
# First-time setup, after `docker compose up --build` is running:
#   docker compose exec backend npm run migrate   (see HOSTING.md)
#   docker compose exec backend npm run seed
#
# The database password below (dev_local_only) matches the same
# throwaway value used in .env.example throughout local development —
# never use it, or any value checked into source control, for a real
# deployment. See HOSTING.md's security section.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_local_only
      POSTGRES_DB: logistics_superapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d logistics_superapp']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app_user:dev_local_only@db:5432/logistics_superapp
      JWT_ACCESS_SECRET: change_this_in_production
      JWT_REFRESH_SECRET: change_this_too_in_production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 30d
      OTP_EXPIRY_SECONDS: 300
      OTP_MAX_ATTEMPTS: 5
      OTP_RESEND_COOLDOWN_SECONDS: 30
      QUOTE_TTL_SECONDS: 90
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
