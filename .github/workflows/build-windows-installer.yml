name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'business-os-desktop/**'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: business-os-desktop/business-os-win/electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: business-os-desktop/business-os-win/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download PHP and MariaDB runtimes
        run: node scripts/download-windows-runtime.js
        working-directory: business-os-desktop

      - name: Build NSIS installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessOS-Windows-Setup
          path: business-os-desktop/business-os-win/dist/*.exe
          retention-days: 90

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: business-os-desktop/business-os-win/dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
