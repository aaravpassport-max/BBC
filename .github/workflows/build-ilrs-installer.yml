name: Build ILRS Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'ilrs-v*'
    paths:
      - 'ILRS/**'
      - '.github/workflows/build-ilrs-installer.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ILRS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ILRS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          npm run build:win
          cd dist && powershell Compress-Archive -Path win-unpacked -DestinationPath "ILRS-Portable-$version-Windows-x64.zip" -Force
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ILRS-Windows-Setup
          path: |
            ILRS/dist/ILRS-Setup-*.exe
            ILRS/dist/ILRS-Portable-*.zip
          retention-days: 90

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/ilrs-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ILRS/dist/ILRS-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ILRS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ILRS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux installers
        run: npm run build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: ILRS-Linux-Setup
          path: |
            ILRS/dist/ILRS-Setup-*.AppImage
            ILRS/dist/ilrs_*.deb
          retention-days: 90

      - name: Attach to GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/ilrs-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ILRS/dist/ILRS-Setup-*.AppImage
            ILRS/dist/ilrs_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
