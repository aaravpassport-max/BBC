name: Build LeadCRM WordPress plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'leadcrm-plugin-v*'
    paths:
      - 'leadcrm-wa-build/**'
      - '.github/workflows/leadcrm-wa-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: bash leadcrm-wa-build/scripts/build-plugin-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leadcrm-wa-build-wordpress
          path: leadcrm-wa-build.zip
          retention-days: 90

      - name: GitHub Release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/leadcrm-plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          name: LeadCRM WordPress plugin ${{ github.ref_name }}
          files: leadcrm-wa-build.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
