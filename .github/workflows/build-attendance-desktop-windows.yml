name: Build Attendance Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - 'cursor/native-wpf-desktop-cf54'
    paths:
      - 'attendance-tracker/**'
      - '.github/workflows/build-attendance-desktop-windows.yml'

permissions:
  contents: write

env:
  APP_VERSION: '1.0.5'
  RELEASE_TAG: attendance-desktop-v1.0.5

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test core engine
        working-directory: attendance-tracker/core
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish native WPF admin app (self-contained)
        working-directory: attendance-tracker/desktop-wpf
        run: |
          dotnet publish "AttendanceTracker.Desktop\AttendanceTracker.Desktop.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o "..\dist\AttendanceTracker-win-x64"

      - name: Publish employee agent (self-contained)
        working-directory: attendance-tracker/agent-windows
        run: |
          dotnet publish "AttendanceAgent.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o "..\dist\AttendanceAgent-win-x64"

      - name: Bundle core runtime for admin sidecar
        shell: pwsh
        run: |
          $out = "attendance-tracker/dist/AttendanceTracker-win-x64"
          New-Item -ItemType Directory -Force -Path "$out/core/dist" | Out-Null
          Copy-Item -Recurse -Force attendance-tracker/core/dist/* "$out/core/dist/"
          New-Item -ItemType Directory -Force -Path "$out/core/scripts" | Out-Null
          Copy-Item -Recurse -Force attendance-tracker/core/scripts/* "$out/core/scripts/"
          Copy-Item -Force attendance-tracker/core/package.json "$out/core/package.json"

      - name: Bundle portable Node.js (admin)
        shell: pwsh
        run: |
          $version = "22.12.0"
          $zip = "node-v$version-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/$zip" -OutFile $env:RUNNER_TEMP\$zip
          Expand-Archive -Path $env:RUNNER_TEMP\$zip -DestinationPath $env:RUNNER_TEMP -Force
          $dest = "attendance-tracker/dist/AttendanceTracker-win-x64/runtime/node"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force "$env:RUNNER_TEMP/node-v$version-win-x64/node.exe" "$dest/node.exe"

      - name: Create portable ZIP (legacy)
        shell: pwsh
        run: |
          $out = "attendance-tracker/dist/AttendanceTracker-win-x64"
          Copy-Item -Recurse -Force attendance-tracker/agent-windows "$out/agent-windows"
          Copy-Item -Recurse -Force attendance-tracker/browser-extension "$out/browser-extension"
          $zip = "attendance-tracker/dist/AttendanceTracker-Windows-x64-v${{ env.APP_VERSION }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$out/*" -DestinationPath $zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installers (Admin + Employee)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = "${{ env.APP_VERSION }}"
          & $iscc "/DAppVersion=$ver" "attendance-tracker/installer/setup-admin.iss"
          & $iscc "/DAppVersion=$ver" "attendance-tracker/installer/setup-employee.iss"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkforceAttendance-Windows-v${{ env.APP_VERSION }}
          path: |
            attendance-tracker/dist/AttendanceTracker-Windows-x64-v${{ env.APP_VERSION }}.zip
            attendance-tracker/installer/output/WorkforceAttendance-Admin-Setup-${{ env.APP_VERSION }}.exe
            attendance-tracker/installer/output/WorkforceAttendance-Employee-Setup-${{ env.APP_VERSION }}.exe
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Workforce Attendance v${{ env.APP_VERSION }} (Windows x64 installers)
          body: |
            ## Install like a normal Windows app (recommended)

            | Role | Download | Install location |
            |------|----------|------------------|
            | **Admin / HR** | `WorkforceAttendance-Admin-Setup-${{ env.APP_VERSION }}.exe` | Start Menu → *Workforce Attendance Console* |
            | **Employee PC** | `WorkforceAttendance-Employee-Setup-${{ env.APP_VERSION }}.exe` | Tray agent; optional “start at login” |

            **Admin first run:** create your own administrator email and password (no pre-made account).

            **Employee:** accept the transparency notice once; the tray icon shows monitoring is active. Optional Chrome extension is in `browser-extension` under the agent install folder.

            ## Portable ZIP (advanced)

            `AttendanceTracker-Windows-x64-v${{ env.APP_VERSION }}.zip` — extract and run `AttendanceTracker.exe` without installer.
          files: |
            attendance-tracker/installer/output/WorkforceAttendance-Admin-Setup-${{ env.APP_VERSION }}.exe
            attendance-tracker/installer/output/WorkforceAttendance-Employee-Setup-${{ env.APP_VERSION }}.exe
            attendance-tracker/dist/AttendanceTracker-Windows-x64-v${{ env.APP_VERSION }}.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
